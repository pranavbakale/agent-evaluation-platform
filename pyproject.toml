[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-platform"
version = "1.0.0"
description = "A deterministic evaluation platform for Python coding tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
]

[project.scripts]
agent-eval = "agent_eval.main:run"
agent-eval-validate = "agent_eval.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eval = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "docker: requires a running Docker daemon and the runner image",
]

[tool.coverage.run]
source = ["agent_eval"]
omit = ["src/agent_eval/main.py"]


name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit and API tests
        env:
          RUNNER_BACKEND: local
        run: pytest --cov=agent_eval --cov-report=term-missing --cov-fail-under=85
      - name: Seeded verifier benchmark
        env:
          RUNNER_BACKEND: local
        run: agent-eval-validate --minimum-precision 1.0 --minimum-recall 1.0

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f Dockerfile.runner -t agent-eval-runner:local .
      - name: Isolation smoke test
        env:
          RUNNER_BACKEND: docker
        run: pytest -m docker

